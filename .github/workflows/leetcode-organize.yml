name: Organize LeetCode

on:
  push:
    branches:
      - main

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get last commit message
        id: commitmsg
        run: echo "msg=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Move LeetCode folders
        run: |
          msg="${{ steps.commitmsg.outputs.msg }}"

          for dir in 0*-*; do
            if [ -d "$dir" ]; then
              if echo "$msg" | grep -qi "Easy"; then
                mkdir -p Python/LeetCode/Easy
                mv "$dir" Python/LeetCode/Easy/ || true
              elif echo "$msg" | grep -qi "Medium"; then
                mkdir -p Python/LeetCode/Medium
                mv "$dir" Python/LeetCode/Medium/ || true
              elif echo "$msg" | grep -qi "Hard"; then
                mkdir -p Python/LeetCode/Hard
                mv "$dir" Python/LeetCode/Hard/ || true
              fi
            fi
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Auto organize LeetCode" || echo "No changes"
          git push
