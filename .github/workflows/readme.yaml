name: Update README

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Count problems
        run: |
          echo "# Algorithm Study" > README.md
          echo "" >> README.md
          echo "## 📂 Baekjoon" >> README.md
          echo "$(ls Baekjoon | wc -l) problems solved" >> README.md
          echo "" >> README.md
          echo "## 📂 LeetCode" >> README.md
          echo "$(ls LeetCode | wc -l) problems solved" >> README.md

      - name: Commit README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add README.md
          git diff --cached --quiet || git commit -m "auto update README"
          git push
