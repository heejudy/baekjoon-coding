name: Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate README
        run: |
          echo "# Algorithm Study" > README.md
          echo "" >> README.md

          generate_content () {
            platform=$1
            content=""

            if [ -d "$platform" ]; then
              for lang in "$platform"/*; do
                [ -d "$lang" ] || continue
                content+="<b>💻 $(basename "$lang")</b><br>"

                for level in "$lang"/*; do
                  [ -d "$level" ] || continue
                  content+="🏅 $(basename "$level")<br>"

                  for problem in "$level"/*; do
                    [ -d "$problem" ] || continue
                    title=$(basename "$problem")

                    encoded_path=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$problem")
                    repo_url="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/${encoded_path}"

                    content+="&nbsp;&nbsp;- <a href=\"$repo_url\">$title</a><br>"
                  done
                done
                content+="<br>"
              done
            fi

            echo "$content"
          }

          baekjoon=$(generate_content "Baekjoon")
          programmers=$(generate_content "Programmers")
          leetcode=$(generate_content "LeetCode")

          echo "| 🟦 Baekjoon | 🟨 Programmers | 🟩 LeetCode |" >> README.md
          echo "|-------------|----------------|-------------|" >> README.md
          echo "| $baekjoon | $programmers | $leetcode |" >> README.md

      - name: Commit README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add README.md
          git diff --cached --quiet || git commit -m "auto update README"
          git push
