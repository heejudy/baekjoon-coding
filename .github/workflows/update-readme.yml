name: Update README

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate README
        run: |
          echo "# Algorithm Study" > README.md
          echo "" >> README.md

          ############################
          # 🟦 Baekjoon
          ############################
          echo "## 🟦 Baekjoon" >> README.md
          echo "" >> README.md

          for lang in $(ls Baekjoon 2>/dev/null); do
            echo "### 💻 $lang" >> README.md
            echo "" >> README.md

            for level in $(ls Baekjoon/$lang 2>/dev/null); do
              echo "#### 🏅 $level" >> README.md
              echo "" >> README.md

              for file in Baekjoon/$lang/$level/*; do
                [ -f "$file" ] || continue
                title=$(basename "$file")
                id=$(echo "$title" | grep -o '[0-9]\+')
                link="https://www.acmicpc.net/problem/$id"
                echo "- [$title]($link)" >> README.md
              done
              echo "" >> README.md
            done
          done

          ############################
          # 🟨 Programmers
          ############################
          echo "## 🟨 Programmers" >> README.md
          echo "" >> README.md

          for lang in $(ls Programmers 2>/dev/null); do
            echo "### 💻 $lang" >> README.md
            echo "" >> README.md

            for level in $(ls Programmers/$lang 2>/dev/null); do
              echo "#### 🏅 $level" >> README.md
              echo "" >> README.md

              for file in Programmers/$lang/$level/*; do
                [ -f "$file" ] || continue
                title=$(basename "$file")
                echo "- $title" >> README.md
              done
              echo "" >> README.md
            done
          done

          ############################
          # 🟩 LeetCode
          ############################
          echo "## 🟩 LeetCode" >> README.md
          echo "" >> README.md

          for lang in $(ls LeetCode 2>/dev/null); do
            echo "### 💻 $lang" >> README.md
            echo "" >> README.md

            for level in $(ls LeetCode/$lang 2>/dev/null); do
              echo "#### 🏅 $level" >> README.md
              echo "" >> README.md

              for file in LeetCode/$lang/$level/*; do
                [ -f "$file" ] || continue
                title=$(basename "$file")
                slug=$(echo "$title" | sed 's/\.[^.]*$//')
                link="https://leetcode.com/problems/$slug"
                echo "- [$title]($link)" >> README.md
              done
              echo "" >> README.md
            done
          done

      - name: Commit README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add README.md
          git diff --cached --quiet || git commit -m "auto update README"
          git push
