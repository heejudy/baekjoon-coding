name: Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate README
        run: |
          echo "# Algorithm Study" > README.md
          echo "" >> README.md

          generate_section () {
            platform=$1

            if [ -d "$platform" ]; then
              echo "## 📂 $platform" >> README.md
              echo "" >> README.md

              for lang in "$platform"/*; do
                [ -d "$lang" ] || continue
                lang_name=$(basename "$lang")

                echo "<details>" >> README.md
                echo "<summary><b>💻 $lang_name</b></summary>" >> README.md
                echo "" >> README.md

                for level in "$lang"/*; do
                  [ -d "$level" ] || continue
                  level_name=$(basename "$level")

                  echo "<details>" >> README.md
                  echo "<summary>🏅 $level_name</summary>" >> README.md
                  echo "" >> README.md

                  for problem in "$level"/*; do
                    [ -d "$problem" ] || continue
                    title=$(basename "$problem")
                  
                    repo_url="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/${problem}"
                    echo "- [$title]($repo_url)" >> README.md
                  
                  done


                  echo "" >> README.md
                  echo "</details>" >> README.md
                  echo "" >> README.md

                done

                echo "</details>" >> README.md
                echo "" >> README.md

              done
            fi
          }

          generate_section "Baekjoon"
          generate_section "Programmers"
          generate_section "LeetCode"

      - name: Commit README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add README.md
          git diff --cached --quiet || git commit -m "auto update README"
          git push
