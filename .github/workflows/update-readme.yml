name: Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate README
        run: |
          echo "# Algorithm Study" > README.md
          echo "" >> README.md

          #################################
          # 🟦 Baekjoon
          #################################
          if [ -d "Baekjoon" ]; then
            echo "## 🟦 Baekjoon" >> README.md
            echo "" >> README.md

            for lang in Baekjoon/*; do
              [ -d "$lang" ] || continue
              lang_name=$(basename "$lang")

              echo "### 💻 $lang_name" >> README.md
              echo "" >> README.md

              for level in "$lang"/*; do
                [ -d "$level" ] || continue
                level_name=$(basename "$level")

                echo "#### 🏅 $level_name" >> README.md
                echo "" >> README.md

                for problem in "$level"/*; do
                  [ -d "$problem" ] || continue
                  title=$(basename "$problem")
                  id=$(echo "$title" | grep -o '^[0-9]\+')
                  link="https://www.acmicpc.net/problem/$id"
                  echo "- [$title]($link)" >> README.md
                done
                echo "" >> README.md
              done
            done
          fi

          #################################
          # 🟨 Programmers
          #################################
          if [ -d "Programmers" ]; then
            echo "## 🟨 Programmers" >> README.md
            echo "" >> README.md

            for lang in Programmers/*; do
              [ -d "$lang" ] || continue
              lang_name=$(basename "$lang")

              echo "### 💻 $lang_name" >> README.md
              echo "" >> README.md

              for level in "$lang"/*; do
                [ -d "$level" ] || continue
                level_name=$(basename "$level")

                echo "#### 🏅 $level_name" >> README.md
                echo "" >> README.md

                for problem in "$level"/*; do
                  [ -d "$problem" ] || continue
                  title=$(basename "$problem")
                  echo "- $title" >> README.md
                done
                echo "" >> README.md
              done
            done
          fi

          #################################
          # 🟩 LeetCode
          #################################
          if [ -d "LeetCode" ]; then
            echo "## 🟩 LeetCode" >> README.md
            echo "" >> README.md

            for lang in LeetCode/*; do
              [ -d "$lang" ] || continue
              lang_name=$(basename "$lang")

              echo "### 💻 $lang_name" >> README.md
              echo "" >> README.md

              for level in "$lang"/*; do
                [ -d "$level" ] || continue
                level_name=$(basename "$level")

                echo "#### 🏅 $level_name" >> README.md
                echo "" >> README.md

                for problem in "$level"/*; do
                  [ -d "$problem" ] || continue
                  title=$(basename "$problem")
                  slug=$(echo "$title" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g')
                  link="https://leetcode.com/problems/$slug"
                  echo "- [$title]($link)" >> README.md
                done
                echo "" >> README.md
              done
            done
          fi

      - name: Commit README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add README.md
          git diff --cached --quiet || git commit -m "auto update README"
          git push
