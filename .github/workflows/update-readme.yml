name: Update README

on:
  push:
    paths:
      - 'Baekjoon/**'
      - 'LeetCode/**'
      - 'Programmers/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate README
        run: |
          echo "# Algorithm Study" > README.md
          echo "" >> README.md

          ############################
          # Baekjoon
          ############################
          if [ -d "Baekjoon" ]; then
            echo "## 🟦 Baekjoon" >> README.md
            echo "" >> README.md

            for lang in Baekjoon/*; do
              [ -d "$lang" ] || continue

              for level in "$lang"/*; do
                [ -d "$level" ] || continue
                level_name=$(basename "$level")

                echo "### $level_name" >> README.md

                for problem in "$level"/*; do
                  [ -d "$problem" ] || continue
                  title=$(basename "$problem")
                  number=$(echo "$title" | grep -o '^[0-9]\+')

                  echo "- [$title](https://www.acmicpc.net/problem/$number)" >> README.md
                done

                echo "" >> README.md
              done
            done
          fi

          ############################
          # LeetCode
          ############################
          if [ -d "LeetCode" ]; then
            echo "---" >> README.md
            echo "" >> README.md
            echo "## 🟨 LeetCode" >> README.md
            echo "" >> README.md

            for level in LeetCode/*; do
              [ -d "$level" ] || continue
              level_name=$(basename "$level")

              echo "### $level_name" >> README.md

              for problem in "$level"/*; do
                [ -d "$problem" ] || continue
                title=$(basename "$problem")
                slug=$(echo "$title" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

                echo "- [$title](https://leetcode.com/problems/$slug/)" >> README.md
              done

              echo "" >> README.md
            done
          fi

          ############################
          # Programmers
          ############################
          if [ -d "Programmers" ]; then
            echo "---" >> README.md
            echo "" >> README.md
            echo "## 🟩 Programmers" >> README.md
            echo "" >> README.md

            for level in Programmers/*; do
              [ -d "$level" ] || continue
              level_name=$(basename "$level")

              echo "### $level_name" >> README.md

              for problem in "$level"/*; do
                [ -d "$problem" ] || continue
                title=$(basename "$problem")
                slug=$(echo "$title" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

                echo "- [$title](https://school.programmers.co.kr/search?keyword=$slug)" >> README.md
              done

              echo "" >> README.md
            done
          fi

      - name: Commit README
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add README.md
          git commit -m "auto update README" || exit 0
          git push
